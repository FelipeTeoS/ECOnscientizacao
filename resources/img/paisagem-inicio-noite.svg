<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="ceu-noite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1830"/>
      <stop offset="1" stop-color="#1c2f4a"/>
    </linearGradient>
    <g id="pegada">
      <ellipse rx="7" ry="11"/><circle cx="-4" cy="-15" r="2.4"/><circle cx="1" cy="-17" r="2.4"/><circle cx="6" cy="-15" r="2.2"/>
    </g>
  </defs>

  <rect width="1440" height="640" fill="url(#ceu-noite)"/>

  <!-- Poucas estrelas, do lado direito, longe do texto; a lua é uma camada à parte (lua.svg) -->
  <g fill="#ffffff">
    <circle cx="820" cy="70" r="1.6" opacity=".7"/>
    <circle cx="905" cy="150" r="1.2" opacity=".5"/>
    <circle cx="1010" cy="95" r="1.8" opacity=".8"/>
    <circle cx="1120" cy="185" r="1.2" opacity=".5"/>
    <circle cx="1190" cy="60" r="1.5" opacity=".7"/>
    <circle cx="1255" cy="230" r="1.3" opacity=".5"/>
    <circle cx="1400" cy="200" r="1.6" opacity=".6"/>
    <circle cx="1080" cy="270" r="1.1" opacity=".4"/>
  </g>

  <!-- Colinas em tons de noite -->
  <path d="M0 400C240 340 480 350 720 380S1200 330 1440 360V640H0Z" fill="#2a4646"/>

  <!-- Colina do meio -->
  <path d="M0 470C200 420 420 430 640 455S1060 470 1240 440S1380 430 1440 436V640H0Z" fill="#22403a"/>

  <!-- Colina da frente com a trilha de pegadas -->
  <path d="M0 540C220 505 460 515 720 535S1180 545 1440 520V640H0Z" fill="#1c3631"/>
  <g fill="#9fb8b0" opacity=".45">
    <use href="#pegada" transform="translate(150 586) rotate(-60)"/>
    <use href="#pegada" transform="translate(200 568) rotate(-75)"/>
    <use href="#pegada" transform="translate(254 574) rotate(-60)"/>
    <use href="#pegada" transform="translate(306 556) rotate(-75)"/>
    <use href="#pegada" transform="translate(360 562) rotate(-60)"/>
  </g>
  <g opacity=".55">
    <circle cx="1060" cy="566" r="7" fill="#d8bf6a"/>
    <circle cx="1090" cy="580" r="6" fill="#c98b84"/>
    <circle cx="1124" cy="562" r="7" fill="#c98b84"/>
    <circle cx="1154" cy="584" r="6" fill="#d8bf6a"/>
  </g>
</svg>
