<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <g id="nuvem">
      <ellipse cx="0" cy="0" rx="90" ry="24"/>
      <circle cx="-35" cy="-16" r="30"/>
      <circle cx="15" cy="-30" r="38"/>
      <circle cx="55" cy="-12" r="26"/>
    </g>
  </defs>
  <!-- Ladrilhos que se repetem sem emenda: nenhuma nuvem encosta na borda -->
  <g fill="#ffffff" opacity=".9">
    <use href="#nuvem" transform="translate(300 150) scale(1.3)"/>
    <use href="#nuvem" transform="translate(900 100) scale(1.1)"/>
  </g>
</svg>
